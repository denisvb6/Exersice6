<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Contact Form</title>

        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <main class="main">
            <section class="contacts">
                <div class="container">
                    <h1 class="h1 contacts__h1">
                        Have a Question ? <br>
                        Get in Touch with us
                    </h1>
                    <p class="contacts__notice">
                        Fill up the Form and ou team will get back to within 24
                        hrs
                    </p>
                    <form class="form contacts__form" action="">
                        <div class="form__control--input">
                            <input
                                class="form__control"
                                type="text"
                                name="userName"
                                placeholder="Name"
                            />
                            <input
                                class="form__control"
                                type="email"
                                name="userEmail"
                                placeholder="Email"
                            />
                        </div>
                        <input
                            class="message-form__control"
                            type="text"
                            name="userMessege"
                            placeholder="Messege"
                        />
                        <button class="btn btn--primary" type="submit">
                            Send Messege
                        </button>
                    </form>
                </div>
            </section>
            <section class="images">
                <img
                    class="two-column two-column__image1"
                    src="assets/Contact-Image-1.jpg"
                    alt="Ресторан"
                />
                <img
                    class="two-column two-column__image2"
                    src="assets/Contact-Image-2.jpg"
                    alt="Кофе с молоком"
                />
            </section>
        </main>
    </body>
</html>
